bundle:
  name: bertopic-narrative-app

resources:
  apps:
    bertopic_analysis:
      name: bertopic-narrative-analysis
      description: "BERTopic Narrative Analysis with Genie Integration"

      source_code_path: ./

      resources:
        - name: sql-wh
          description: Serverless Starter Warehouse for Genie and dashboard queries
          sql_warehouse:
            id: 593af0ca865fa166
            permission: CAN_USE

        - name: genie-space
          description: BERTopic Narrative Agent Genie space
          genie_space:
            name: BERTopic Narrative Agent
            space_id: 01f14d5383a21f0e8626a80d72315de3
            permission: CAN_RUN

        - name: v2-topic-scores-l1
          description: BERTopic view
          uc_securable:
            securable_full_name: amit.bertopic.v2_topic_info_with_scores_layer_1
            securable_type: TABLE
            permission: SELECT

        - name: v3-msg-topic
          description: BERTopic view
          uc_securable:
            securable_full_name: amit.bertopic.v3_messages_sentiment_topic_consolidated
            securable_type: TABLE
            permission: SELECT

        - name: bertopic-input-index
          description: BERTopic input vector search index used as agent source context
          uc_securable:
            securable_full_name: amit.bertopic.bertopic_input_index
            securable_type: TABLE
            permission: SELECT

        - name: agent-llm-llama-8b
          description: Llama 3.1 8B chat model for cost-effective agent synthesis
          serving_endpoint:
            name: databricks-meta-llama-3-1-8b-instruct
            permission: CAN_QUERY

        - name: agent-llm-gemma-12b
          description: Gemma 3 12B chat model for cost-effective agent synthesis
          serving_endpoint:
            name: databricks-gemma-3-12b
            permission: CAN_QUERY

        - name: agent-llm-gpt-oss-20b
          description: GPT OSS 20B chat model for higher-quality agent synthesis
          serving_endpoint:
            name: databricks-gpt-oss-20b
            permission: CAN_QUERY

      
      config:
        command:
          - "streamlit"
          - "run"
          - "app.py"

targets:
  dev:
    mode: development
    workspace:
      host: https://dbc-de54b796-a6c4.cloud.databricks.com
